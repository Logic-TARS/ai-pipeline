services:
  ai-popline:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # The host port is loopback-only. The bridge hop is treated as an authenticated HTTP peer.
      WEB_ALLOWED_NETWORKS: 172.16.0.0/12
      WEB_AUTH_REQUIRED: "true"
      WEB_ALLOW_ZEROTIER_HTTP: "true"
    volumes:
      - ./output:/data
      - ./profiles:/app/profiles:ro
      - ${GEMINI_SKILL_DIR:-/opt/gemini-skill}:${GEMINI_SKILL_DIR:-/opt/gemini-skill}:ro
      - ${MPT_DIR:-/opt/mpt}:${MPT_DIR:-/opt/mpt}:ro
      - ${PHOTO_PROCESS_DIR:-/opt/photo-process}:${PHOTO_PROCESS_DIR:-/opt/photo-process}:ro
      - ${SAU_DIR:-/opt/sau}:${SAU_DIR:-/opt/sau}:ro
